{% extends "base.html" %}
{% block titulo %}Atendimento · {{ hotel_chat.nome }}{% endblock %}
{% block menu_topo %}<span class="menu-sep">Atendimento ao hóspede</span>{% endblock %}
{% block conteudo %}
<div class="chat-hospede">
  <label class="campo tel-hospede">Seu WhatsApp
    <input id="telefone" inputmode="tel" autocomplete="tel" value="{{ telefone }}">
  </label>

  <section class="celular" aria-label="Conversa">
    <div class="celular-topo">
      <div class="celular-titulo">
        <strong>{{ hotel_chat.nome }}</strong>
        <small id="info-hospede">&nbsp;</small>
      </div>
      <span id="status" class="status-conversa">…</span>
    </div>
    <div id="mensagens" class="mensagens" aria-live="polite"></div>
    <form id="form-msg" class="composer" autocomplete="off">
      <input id="texto" placeholder="Digite uma mensagem" aria-label="Mensagem">
      <button class="botao">Enviar</button>
    </form>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>window.HOTEL = {{ hotel_chat.slug|tojson }};</script>
<script src="/static/chat.js"></script>
{% endblock %}
